backend:
  name: github
  repo: RahulSureshbabu/the-thoughtful-mind
  branch: main
  base_url: https://your-worker.workers.dev # TODO: replace with the deployed sveltia-cms-auth Worker URL
  auth_endpoint: auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Switches Sveltia's own interface (buttons, menus) to Portuguese too.
locale: "pt"

# The writer only ever authors in Portuguese (Portugal) — every other language
# is generated automatically by the CI translation step (scripts/translate.mjs).
# Do not add per-language collections here.
collections:
  - name: posts
    label: Artigos
    folder: src/content/posts/pt
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Descrição, name: description, widget: text }
      - { label: "Data de publicação", name: pubDate, widget: datetime }
      - { label: "Data de atualização", name: updatedDate, widget: datetime, required: false }
      - { label: Etiquetas, name: tags, widget: list, default: [] }
      - { label: "Imagem de capa", name: coverImage, widget: image, required: false }
      - { label: "Texto alternativo da imagem", name: coverImageAlt, widget: string, required: false }
      - { label: Destaque, name: featured, widget: boolean, default: false }
      - { label: Rascunho, name: draft, widget: boolean, default: true }
      - { label: Conteúdo, name: body, widget: markdown }
